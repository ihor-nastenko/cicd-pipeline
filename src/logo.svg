<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Transparent background -->
  <rect x="56" y="56" width="400" height="400" rx="72"
        fill="#0F172A" stroke="url(#frame)" stroke-width="24"/>

  <!-- Decorative code lines -->
  <g stroke="#64748B" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <path d="M110 125 H205"/>
    <path d="M110 155 H170"/>
    <path d="M345 125 H402"/>
    <path d="M365 155 H410"/>
    <path d="M110 397 H205"/>
    <path d="M330 397 H402"/>
  </g>

  <!-- Code symbol -->
  <g fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 185 L135 230 L190 275"/>
    <path d="M322 185 L377 230 L322 275"/>
    <path d="M278 165 L235 295"/>
  </g>

  <!-- DEV text as vector paths-ish/simple text -->
  <text x="256" y="385"
        text-anchor="middle"
        font-family="DejaVu Sans, Arial, sans-serif"
        font-size="112"
        font-weight="800"
        fill="url(#accent)"
        letter-spacing="2">DEV</text>
</svg>
